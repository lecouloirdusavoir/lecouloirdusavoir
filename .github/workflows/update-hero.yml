name: Mise à jour automatique du hero

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - 'build_hero.py'

  workflow_dispatch:

jobs:
  build-hero:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mettre à jour les dates de fichiers (git log)
        run: |
          git ls-files --others --exclude-standard --cached | \
          while read file; do
            ts=$(git log -1 --format="%ct" -- "$file" 2>/dev/null)
            if [ -n "$ts" ]; then
              touch -d "@$ts" "$file"
            fi
          done

      - name: Générer le hero
        run: python build_hero.py

      - name: Vérifier si index.html a changé
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Pousser le index.html mis à jour
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🤖 Hero mis à jour automatiquement [skip ci]"
          git push
